<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冒险岛闯关 · 彩色圆点 · 词句练习</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #1e2b3f 0%, #0f1a2b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1.2rem;
        }

        .game-container {
            background: rgba(28, 40, 58, 0.94);
            backdrop-filter: blur(8px);
            border-radius: 2.5rem;
            padding: 1.8rem 1.8rem 2rem;
            box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.7), inset 0 1px 2px rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(120, 170, 255, 0.25);
            width: 1100px;
            max-width: 100%;
        }

        h1 {
            text-align: center;
            color: #d6e6ff;
            font-weight: 500;
            font-size: 1.9rem;
            letter-spacing: 2px;
            margin-top: 0;
            margin-bottom: 1.2rem;
            text-shadow: 0 4px 10px #1b2b44;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        h1 span {
            font-size: 1.9rem;
            filter: drop-shadow(0 0 6px #5b9eff);
        }

        /* ===== 设置面板 ===== */
        .setup-panel {
            background: #16222f;
            border-radius: 1.8rem;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.2rem;
            border: 1px solid #2f547a;
            transition: opacity 0.25s;
        }

        .setup-panel.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .setup-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.7rem 1.2rem;
            margin-bottom: 0.7rem;
        }

        .setup-row:last-child {
            margin-bottom: 0;
        }

        .setup-row label {
            color: #b0cdf0;
            font-weight: 400;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .setup-row input[type="number"] {
            background: #0d1825;
            border: 1px solid #3a5e85;
            color: #eaf2ff;
            font-size: 0.95rem;
            padding: 0.4rem 0.9rem;
            border-radius: 2rem;
            width: 80px;
            outline: none;
            text-align: center;
            font-weight: 500;
        }

        .setup-row input[type="text"],
        .setup-row textarea {
            background: #0d1825;
            border: 1px solid #3a5e85;
            color: #eaf2ff;
            font-size: 0.9rem;
            padding: 0.5rem 1.1rem;
            border-radius: 1.8rem;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
            resize: vertical;
        }

        .setup-row textarea {
            border-radius: 1.2rem;
            min-height: 60px;
        }

        .setup-row input:focus,
        .setup-row textarea:focus {
            border-color: #6ea8fe;
            box-shadow: 0 0 0 3px #3f6da5;
        }

        .words-input {
            flex: 1;
            min-width: 250px;
        }

        .sentence-input {
            flex: 2;
            min-width: 280px;
        }

        .btn {
            background: #2e4f74;
            border: none;
            color: white;
            font-weight: 500;
            font-size: 0.9rem;
            padding: 0.55rem 1.2rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid #5982b0;
            box-shadow: 0 4px 0 #0e1a28;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .btn:hover {
            background: #3e6a97;
            transform: translateY(-1px);
            box-shadow: 0 5px 0 #0e1a28;
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #0e1a28;
        }

        .btn:disabled {
            opacity: 0.5;
            transform: translateY(0);
            box-shadow: 0 3px 0 #0e1a28;
            pointer-events: none;
            filter: grayscale(0.5);
        }

        .btn-small {
            padding: 0.3rem 0.8rem;
            font-size: 0.8rem;
        }

        .btn-secondary {
            background: #30445c;
            border-color: #486d99;
        }

        .btn-secondary:hover {
            background: #3f5f80;
        }

        .btn-success {
            background: #1e5c3a;
            border-color: #2ecc71;
            box-shadow: 0 4px 0 #0e2818;
        }

        .btn-success:hover {
            background: #2a7a4a;
        }

        .btn-danger {
            background: #6b2a2a;
            border-color: #e74c3c;
            box-shadow: 0 4px 0 #2a0e0e;
        }

        .btn-danger:hover {
            background: #8a3636;
        }

        .btn-large {
            font-size: 1.1rem;
            padding: 0.8rem 1.8rem;
            border-radius: 3rem;
        }

        .hint-text {
            font-size: 0.78rem;
            color: #6b8ab0;
        }

        /* ===== 学生彩色圆点 ===== */
        .students-panel {
            background: #0f1a28;
            border-radius: 1.8rem;
            padding: 1rem 1.2rem 0.8rem;
            margin-bottom: 1.2rem;
            border: 1px solid #2c4b6e;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.6rem;
            padding: 0 0.2rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .panel-header h2 {
            font-size: 1rem;
            font-weight: 400;
            color: #9bb9de;
            margin: 0;
            letter-spacing: 0.8px;
        }

        .student-dots {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            min-height: 3rem;
            align-items: center;
            padding: 0.3rem 0.2rem;
        }

        .student-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
        }

        .student-dot {
            width: 2.8rem;
            height: 2.8rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1.1rem;
            color: white;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4), 0 0 0 2px rgba(255, 255, 255, 0.15);
            transition: 0.15s;
            position: relative;
            flex-shrink: 0;
            cursor: pointer;
            user-select: none;
        }

        .student-dot.active {
            box-shadow: 0 0 0 4px #fff, 0 0 28px 8px currentColor;
            transform: scale(1.12);
            z-index: 2;
        }

        .student-dot.done {
            opacity: 0.35;
            filter: grayscale(0.6);
            transform: scale(0.9);
        }

        .student-dot.frozen-next {
            box-shadow: 0 0 0 4px #00bcd4, 0 0 25px 8px #00bcd4;
            transform: scale(1.1);
            z-index: 2;
        }

        .student-dot .dot-number {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.95);
            background: rgba(0, 0, 0, 0.25);
            width: 1.8rem;
            height: 1.8rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            border: 1px solid rgba(255, 255, 255, 0.35);
        }

        .student-stars {
            font-size: 0.85rem;
            color: #ffd966;
            font-weight: 600;
            text-shadow: 0 1px 2px #000;
            white-space: nowrap;
        }

        /* ===== 游戏状态区 ===== */
        .game-status {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem 1.5rem;
            align-items: center;
            justify-content: space-between;
            background: #0d1a28;
            padding: 0.9rem 1.3rem;
            border-radius: 1.5rem;
            border: 1px solid #2f547a;
            margin-bottom: 1rem;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: #b0cdf0;
        }

        .status-item strong {
            color: #ffd966;
        }

        .turn-dot-big {
            width: 1.4rem;
            height: 1.4rem;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 14px currentColor;
            flex-shrink: 0;
        }

        /* ===== 骰子区域 ===== */
        .dice-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            background: #0d1a28;
            padding: 1rem 2rem;
            border-radius: 3rem;
            border: 1px solid #2f547a;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
        }

        /* 真实骰子样式 */
        .dice-real {
            width: 70px;
            height: 70px;
            background-color: white;
            border-radius: 12px;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.1), 0 6px 15px rgba(0,0,0,0.5);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 8px;
            gap: 4px;
            position: relative;
            transition: transform 0.2s;
        }

        .dice-real.rolling {
            animation: diceRoll 0.5s ease-in-out;
        }

        @keyframes diceRoll {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(20deg) scale(1.1); }
            50% { transform: rotate(-20deg) scale(1.1); }
            75% { transform: rotate(15deg) scale(1.05); }
            100% { transform: rotate(0deg) scale(1); }
        }

        .dice-dot {
            background-color: #111;
            border-radius: 50%;
            width: 100%;
            height: 100%;
            align-self: center;
            justify-self: center;
            box-shadow: inset 0 2px 3px rgba(0,0,0,0.6);
        }

        /* 用网格定位骰子点数 */
        .dice-face-1 .dice-dot:nth-child(1) { grid-area: 2 / 2; }
        
        .dice-face-2 .dice-dot:nth-child(1) { grid-area: 1 / 1; }
        .dice-face-2 .dice-dot:nth-child(2) { grid-area: 3 / 3; }
        
        .dice-face-3 .dice-dot:nth-child(1) { grid-area: 1 / 1; }
        .dice-face-3 .dice-dot:nth-child(2) { grid-area: 2 / 2; }
        .dice-face-3 .dice-dot:nth-child(3) { grid-area: 3 / 3; }
        
        .dice-face-4 .dice-dot:nth-child(1) { grid-area: 1 / 1; }
        .dice-face-4 .dice-dot:nth-child(2) { grid-area: 1 / 3; }
        .dice-face-4 .dice-dot:nth-child(3) { grid-area: 3 / 1; }
        .dice-face-4 .dice-dot:nth-child(4) { grid-area: 3 / 3; }
        
        .dice-face-5 .dice-dot:nth-child(1) { grid-area: 1 / 1; }
        .dice-face-5 .dice-dot:nth-child(2) { grid-area: 1 / 3; }
        .dice-face-5 .dice-dot:nth-child(3) { grid-area: 2 / 2; }
        .dice-face-5 .dice-dot:nth-child(4) { grid-area: 3 / 1; }
        .dice-face-5 .dice-dot:nth-child(5) { grid-area: 3 / 3; }
        
        .dice-face-6 .dice-dot:nth-child(1) { grid-area: 1 / 1; }
        .dice-face-6 .dice-dot:nth-child(2) { grid-area: 1 / 3; }
        .dice-face-6 .dice-dot:nth-child(3) { grid-area: 2 / 1; }
        .dice-face-6 .dice-dot:nth-child(4) { grid-area: 2 / 3; }
        .dice-face-6 .dice-dot:nth-child(5) { grid-area: 3 / 1; }
        .dice-face-6 .dice-dot:nth-child(6) { grid-area: 3 / 3; }

        .dice-number-text {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffd966;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            min-width: 100px;
        }

        /* ===== 挑战/奖励 卡片 ===== */
        .event-card {
            background: #0a121e;
            border-radius: 1.5rem;
            padding: 1.2rem 1.5rem;
            border: 1px solid #2f547a;
            margin-bottom: 1.2rem;
            display: none;
        }

        .event-card.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .event-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.8rem;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .event-header.challenge-header { color: #e74c3c; }
        .event-header.reward-header { color: #3498db; }
        .event-header.normal-header { color: #2ecc71; }
        .event-header.freeze-header { color: #00bcd4; }

        .event-content {
            font-size: 1.15rem;
            color: #eaf2ff;
            line-height: 1.6;
            margin-bottom: 0.8rem;
            padding: 0.8rem 1.2rem;
            background: #14212f;
            border-radius: 1rem;
            border-left: 4px solid #ffd966;
        }

        .event-actions {
            display: flex;
            gap: 0.7rem;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        /* ===== 地图区域（移至下方并变小） ===== */
        .map-area {
            background: #0b1420;
            border-radius: 1.8rem;
            padding: 1rem 1.2rem;
            border: 1px solid #2d5073;
            box-shadow: inset 0 0 30px #03070c;
            margin-bottom: 1.2rem;
        }

        .map-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .map-header h2 {
            font-size: 0.95rem;
            font-weight: 400;
            color: #9bb9de;
            margin: 0;
        }

        .map-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 0.35rem;
            max-width: 100%;
        }

        .map-cell {
            aspect-ratio: 1;
            border-radius: 0.4rem;
            background: #14212f;
            border: 1px solid #1f3a52;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            color: #5d799b;
            position: relative;
            transition: 0.2s;
            min-width: 0;
            overflow: hidden;
            padding: 0.05rem;
        }

        .map-cell .cell-icon { font-size: 0.9rem; line-height: 1; }
        .map-cell .cell-label { font-size: 0.45rem; line-height: 1; margin-top: 1px; }

        .map-cell.start { background: #1e3a28; border-color: #2ecc71; color: #2ecc71; }
        .map-cell.end { background: #3a2e1e; border-color: #f39c12; color: #f39c12; }
        .map-cell.challenge { background: #3a1e1e; border-color: #e74c3c; color: #e74c3c; }
        .map-cell.reward { background: #1e2e3a; border-color: #3498db; color: #3498db; }
        .map-cell.freeze { background: #1e3a4a; border-color: #00bcd4; color: #00bcd4; }

        .map-cell.current-cell {
            box-shadow: 0 0 0 2px #fff, 0 0 12px 2px #ffd96680;
            transform: scale(1.1);
            z-index: 2;
        }

        .map-cell .student-markers {
            position: absolute;
            bottom: 1px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 100%;
        }

        .map-cell .marker-dot {
            width: 0.6rem;
            height: 0.6rem;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.8);
            flex-shrink: 0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.4);
        }

        .map-cell .marker-dot.marker-active {
            box-shadow: 0 0 6px 1px #fff, 0 0 12px 2px currentColor;
            transform: scale(1.2);
            z-index: 1;
        }

        /* 日志 */
        .game-log {
            background: #01070e;
            border-radius: 1.2rem;
            padding: 0.8rem 1.2rem;
            min-height: 60px;
            max-height: 100px;
            overflow-y: auto;
            color: #b7d0ea;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.85rem;
            border: 1px solid #1f3f5c;
            box-shadow: inset 0 0 15px #000000;
            margin-bottom: 1rem;
        }

        .log-entry {
            padding: 0.15rem 0;
            border-bottom: 1px solid #12212e;
            display: flex;
            gap: 0.7rem;
        }

        .log-entry .log-time { color: #4e7299; font-size: 0.75rem; min-width: 2.8rem; }
        .log-entry .log-text { color: #cfe1ff; }

        .game-actions {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .footer-note {
            color: #4e6d8c;
            text-align: center;
            font-size: 0.72rem;
            margin-top: 0.8rem;
            letter-spacing: 0.5px;
        }

        .empty-message {
            color: #5d799b;
            font-style: italic;
            padding: 0.6rem 0.4rem;
            font-size: 0.9rem;
        }

        .reward-line {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.6rem;
            flex-wrap: wrap;
            font-size: 1.2rem;
        }
        .color-icon {
            display: inline-block;
            width: 1.4rem;
            height: 1.4rem;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 10px currentColor;
        }

        .freeze-progress {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            justify-content: center;
            margin: 1rem 0;
            font-size: 1.8rem;
            color: #ffd966;
            font-weight: 600;
        }
        
        /* 放大冻结生字的展示区 */
        .freeze-word-big {
            font-size: 5rem;
            color: #ffd966;
            text-align: center;
            font-weight: 800;
            margin: 1.5rem 0;
            letter-spacing: 0.5rem;
            text-shadow: 0 0 30px #ffd96680;
        }
        .freeze-words-list {
            font-size: 2rem;
            text-align: center;
            line-height: 2;
            margin: 0.8rem 0;
        }
        .freeze-words-list span {
            display: inline-block;
            margin: 0 1rem;
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>
        <span>🏝️</span> 冒险岛闯关 <span>⚔️</span>
    </h1>

    <!-- ===== 设置面板 ===== -->
    <div class="setup-panel" id="setupPanel">
        <div class="setup-row">
            <label>
                👥 学生人数
                <input type="number" id="studentCountInput" min="1" max="12" value="4" step="1">
            </label>
            <button class="btn btn-small" id="applyCountBtn">应用人数</button>
            <span class="hint-text">（1-12人，颜色区分）</span>
        </div>
        <div class="setup-row">
            <label style="flex:1;">
                📝 字词（普通格/冻结格出现）
                <input type="text" id="wordsInput" class="words-input"
                       value="始 烟 传 巨 怜 节 背 市场 卖 沙 金 整"
                       placeholder="用空格分隔多个词语，如：苹果 香蕉 橘子">
            </label>
        </div>
        <div class="setup-row">
            <label style="flex:1; align-items: flex-start;">
                📖 句子（挑战/奖励格出现）
                <textarea id="sentenceInput" class="sentence-input" rows="3"
                          placeholder="每行一个句子，例如：&#10;喝一杯饮料的时候,怎么能先喝下面的再喝上面的?&#10;今天天气真好，我们一起去公园玩。">喝一杯饮料的时候,怎么能先喝下面的再喝上面的?
今天天气真好，我们一起去公园玩。
小猫在阳光下打盹，懒洋洋的。</textarea>
            </label>
        </div>
        <div class="setup-row" style="justify-content: flex-end; margin-top: 0.2rem;">
            <button class="btn btn-small" id="applyWordsBtn">应用字词与句子</button>
        </div>
    </div>

    <!-- ===== 学生彩色圆点 ===== -->
    <div class="students-panel">
        <div class="panel-header">
            <h2>🎨 学生顺序（点击圆点移到最前）</h2>
            <button class="btn btn-small btn-secondary" id="resetOrderBtn">↺ 重置顺序</button>
        </div>
        <div class="student-dots" id="studentDotsContainer">
            <!-- 动态渲染 -->
        </div>
    </div>

    <!-- ===== 游戏状态栏 ===== -->
    <div class="game-status">
        <div class="status-item" id="turnIndicator">
            <span class="turn-dot-big" style="background:#555; color:#555;"></span>
            <span>当前：<strong>等待开始</strong></span>
        </div>
        <div class="status-item">
            <span>⭐ 总星星：<strong id="starCountDisplay">0</strong></span>
        </div>
        <div class="status-item">
            <span>📍 进度：<strong id="progressDisplay">0 / 50</strong></span>
        </div>
    </div>

    <!-- ===== 骰子区域（真实骰子） ===== -->
    <div class="dice-area" id="diceArea">
        <div class="dice-real dice-face-1" id="diceReal">
            <!-- 骰子点数将通过JS动态渲染 -->
            <div class="dice-dot"></div>
        </div>
        <div class="dice-number-text" id="diceNumberText">骰子：1 点</div>
        <button class="btn btn-large" id="rollDiceBtn" disabled>🎲 投骰子</button>
    </div>

    <!-- ===== 挑战/奖励 事件卡（核心交互区上移） ===== -->
    <div class="event-card" id="eventCard">
        <div class="event-header" id="eventHeader"></div>
        <div class="event-content" id="eventContent"></div>
        <div class="event-actions" id="eventActions"></div>
    </div>

    <!-- ===== 地图区域（移到底部且尺寸变小） ===== -->
    <div class="map-area">
        <div class="map-header">
            <h2>🗺️ 冒险地图 (1~50格)</h2>
            <div class="status-item" style="font-size:0.8rem; gap:0.8rem;">
                <span>🏁 起点</span>
                <span>⚔️ 挑战</span>
                <span>🎁 奖励</span>
                <span>❄️ 冻结</span>
                <span>🏆 终点</span>
            </div>
        </div>
        <div class="map-grid" id="mapGrid">
            <!-- 动态渲染地图 -->
        </div>
    </div>

    <!-- ===== 日志 ===== -->
    <div class="game-log" id="gameLog">
        <div class="log-entry">
            <span class="log-time">[系统]</span>
            <span class="log-text">设置字词和句子，点击「开始闯关」</span>
        </div>
    </div>

    <!-- ===== 操作按钮 ===== -->
    <div class="game-actions">
        <button class="btn" id="startGameBtn" disabled>▶ 开始闯关</button>
        <button class="btn btn-secondary" id="resetGameBtn">🔄 重置游戏</button>
    </div>

    <div class="footer-note">— 冒险岛闯关 · 冻结格读错将被跳过一轮 —</div>
</div>

<script>
    (function() {
        // ================= 常量与状态 =================
        const MAP_SIZE = 50;
        const START_CELL = 0;
        const END_CELL = MAP_SIZE - 1;
        const CHALLENGE_CELLS = [5, 12, 19, 26, 33, 41, 48];
        const REWARD_CELLS = [3, 9, 16, 23, 30, 37, 44];
        const FREEZE_CELLS = [7, 14, 21, 28, 35, 42, 49];

        let studentCount = 4;
        let students = [];
        let currentPlayerIndex = 0;
        let gameActive = false;

        // 学生位置与星星
        let studentPositions = [];
        let studentStars = [];
        let studentFinished = [];
        let studentSkipNext = [];     // 标记是否在下一轮被冻结（无法投骰子）

        // 冻结状态
        let isFrozen = false;          // 是否正在冻结面板中答题
        let frozenWordCount = 0;       // 当前在冻结面板中已读对的字数
        let currentFreezeWords = [];   // 当前这轮冻结的生字
        let freezeSessionFailed = false; // 本次冻结是否读错过

        // 练习内容
        let wordsArray = [];
        let sentenceArray = [];

        // 不重复出现用的池子
        let remainingWords = [];
        let remainingSentences = [];

        // 颜色池
        const colorPalette = [
            '#e74c3c', '#3498db', '#2ecc71', '#f39c12',
            '#9b59b6', '#1abc9c', '#e67e22', '#e91e63',
            '#00bcd4', '#8bc34a', '#ff5722', '#795548',
        ];

        // DOM
        const setupPanel = document.getElementById('setupPanel');
        const studentCountInput = document.getElementById('studentCountInput');
        const applyCountBtn = document.getElementById('applyCountBtn');
        const wordsInput = document.getElementById('wordsInput');
        const sentenceInput = document.getElementById('sentenceInput');
        const applyWordsBtn = document.getElementById('applyWordsBtn');
        const studentDotsContainer = document.getElementById('studentDotsContainer');
        const resetOrderBtn = document.getElementById('resetOrderBtn');
        const mapGrid = document.getElementById('mapGrid');
        const turnIndicator = document.getElementById('turnIndicator');
        const starCountDisplay = document.getElementById('starCountDisplay');
        const progressDisplay = document.getElementById('progressDisplay');
        const eventCard = document.getElementById('eventCard');
        const eventHeader = document.getElementById('eventHeader');
        const eventContent = document.getElementById('eventContent');
        const eventActions = document.getElementById('eventActions');
        const gameLog = document.getElementById('gameLog');
        const startGameBtn = document.getElementById('startGameBtn');
        const rollDiceBtn = document.getElementById('rollDiceBtn');
        const resetGameBtn = document.getElementById('resetGameBtn');
        const diceReal = document.getElementById('diceReal');
        const diceNumberText = document.getElementById('diceNumberText');

        // ================= 工具 =================
        function log(message, isSystem = true) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const timeSpan = document.createElement('span');
            timeSpan.className = 'log-time';
            timeSpan.textContent = `[${isSystem ? '系统' : '游戏'}]`;
            const textSpan = document.createElement('span');
            textSpan.className = 'log-text';
            textSpan.textContent = message;
            entry.appendChild(timeSpan);
            entry.appendChild(textSpan);
            gameLog.appendChild(entry);
            gameLog.scrollTop = gameLog.scrollHeight;
            while (gameLog.children.length > 40) {
                gameLog.removeChild(gameLog.firstChild);
            }
        }

        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function generateStudentColors(count) {
            const colors = [];
            for (let i = 0; i < count; i++) {
                colors.push(colorPalette[i % colorPalette.length]);
            }
            return colors;
        }

        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function drawFromPool(pool, originalArray) {
            if (pool.length === 0) {
                pool.push(...originalArray);
            }
            const idx = randomInt(0, pool.length - 1);
            return pool.splice(idx, 1)[0];
        }

        // 渲染真实骰子
        function renderDiceFace(number) {
            diceReal.className = `dice-real dice-face-${number}`;
            diceReal.innerHTML = '';
            const dotCount = number;
            for (let i = 0; i < dotCount; i++) {
                const dot = document.createElement('div');
                dot.className = 'dice-dot';
                diceReal.appendChild(dot);
            }
            diceNumberText.textContent = `骰子：${number} 点`;
        }

        // ================= 学生渲染 =================
        function renderStudentDots() {
            studentDotsContainer.innerHTML = '';
            if (students.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-message';
                empty.textContent = '请设置学生人数';
                studentDotsContainer.appendChild(empty);
                return;
            }

            students.forEach((color, index) => {
                const item = document.createElement('div');
                item.className = 'student-item';

                const dot = document.createElement('div');
                dot.className = 'student-dot';
                dot.style.backgroundColor = color;
                dot.style.color = color;

                const numSpan = document.createElement('span');
                numSpan.className = 'dot-number';
                numSpan.textContent = index + 1;
                dot.appendChild(numSpan);

                if (gameActive) {
                    if (index === currentPlayerIndex) dot.classList.add('active');
                    if (studentFinished[index]) dot.classList.add('done');
                    if (studentSkipNext[index]) dot.classList.add('frozen-next');
                }

                dot.title = `第 ${index+1} 位学生 | 位置: ${studentPositions[index] ?? 1} ${studentSkipNext[index] ? '(冻结中)' : ''}`;
                item.appendChild(dot);

                const starSpan = document.createElement('span');
                starSpan.className = 'student-stars';
                starSpan.textContent = `${studentStars[index] || 0}🌟`;
                item.appendChild(starSpan);

                studentDotsContainer.appendChild(item);
            });
        }

        // ================= 地图渲染 =================
        function renderMap() {
            mapGrid.innerHTML = '';
            for (let i = 0; i < MAP_SIZE; i++) {
                const cell = document.createElement('div');
                cell.className = 'map-cell';

                if (i === START_CELL) cell.classList.add('start');
                else if (i === END_CELL) cell.classList.add('end');
                else if (CHALLENGE_CELLS.includes(i)) cell.classList.add('challenge');
                else if (REWARD_CELLS.includes(i)) cell.classList.add('reward');
                else if (FREEZE_CELLS.includes(i)) cell.classList.add('freeze');

                const iconSpan = document.createElement('span');
                iconSpan.className = 'cell-icon';
                if (i === START_CELL) iconSpan.textContent = '🏁';
                else if (i === END_CELL) iconSpan.textContent = '🏆';
                else if (CHALLENGE_CELLS.includes(i)) iconSpan.textContent = '⚔️';
                else if (REWARD_CELLS.includes(i)) iconSpan.textContent = '🎁';
                else if (FREEZE_CELLS.includes(i)) iconSpan.textContent = '❄️';
                else iconSpan.textContent = '·';
                cell.appendChild(iconSpan);

                const labelSpan = document.createElement('span');
                labelSpan.className = 'cell-label';
                labelSpan.textContent = i + 1;
                cell.appendChild(labelSpan);

                if (gameActive) {
                    const markersContainer = document.createElement('div');
                    markersContainer.className = 'student-markers';
                    for (let s = 0; s < students.length; s++) {
                        if (studentPositions[s] === i) {
                            const marker = document.createElement('span');
                            marker.className = 'marker-dot';
                            marker.style.backgroundColor = students[s];
                            marker.title = `第${s+1}位学生`;
                            if (s === currentPlayerIndex) marker.classList.add('marker-active');
                            markersContainer.appendChild(marker);
                        }
                    }
                    if (markersContainer.children.length > 0) cell.appendChild(markersContainer);
                }

                if (gameActive && studentPositions[currentPlayerIndex] === i) {
                    cell.classList.add('current-cell');
                }

                mapGrid.appendChild(cell);
            }
        }

        // ================= 状态栏更新 =================
        function updateStatus() {
            if (!gameActive || students.length === 0) {
                turnIndicator.innerHTML = `<span class="turn-dot-big" style="background:#555; color:#555;"></span>
                    <span>当前：<strong>等待开始</strong></span>`;
            } else {
                const color = students[currentPlayerIndex];
                const pos = studentPositions[currentPlayerIndex] ?? 0;
                const posDisplay = pos + 1;
                let statusText = '';
                if (studentSkipNext[currentPlayerIndex]) {
                    statusText = ' ❄️ 被冻结，无法投骰子';
                }
                turnIndicator.innerHTML = `<span class="turn-dot-big" style="background:${color}; color:${color};"></span>
                    <span>当前：<strong>第 ${currentPlayerIndex + 1} 位</strong> (位置 ${posDisplay})${statusText}</span>`;
            }

            const totalStars = studentStars.reduce((a, b) => a + b, 0);
            starCountDisplay.textContent = totalStars;

            const finishedCount = studentFinished.filter(Boolean).length;
            progressDisplay.textContent = `${finishedCount} / ${students.length} 到达终点`;
        }

        // ================= 刷新 =================
        function refreshUI() {
            renderStudentDots();
            renderMap();
            updateStatus();
            updateGameControls();
        }

        function updateGameControls() {
            if (!gameActive) {
                startGameBtn.disabled = students.length === 0 || wordsArray.length === 0;
                rollDiceBtn.disabled = true;
                setupPanel.classList.remove('disabled');
            } else {
                startGameBtn.disabled = true;
                rollDiceBtn.disabled = eventCard.classList.contains('show') || isFrozen;
                setupPanel.classList.add('disabled');
            }
        }

        // ================= 游戏逻辑 =================

        function startGame() {
            if (students.length === 0) { log('请先设置学生人数。', true); return; }
            if (wordsArray.length < 5) { log('字词至少需要5个，以便冻结格使用。', true); return; }
            if (sentenceArray.length === 0) { log('请先输入句子。', true); return; }

            studentPositions = students.map(() => 0);
            studentStars = students.map(() => 0);
            studentFinished = students.map(() => false);
            studentSkipNext = students.map(() => false);
            currentPlayerIndex = 0;
            isFrozen = false;
            frozenWordCount = 0;
            currentFreezeWords = [];
            freezeSessionFailed = false;

            remainingWords = shuffleArray(wordsArray);
            remainingSentences = shuffleArray(sentenceArray);

            gameActive = true;
            eventCard.classList.remove('show');
            renderDiceFace(1);

            log('⚡ 冒险开始！读错冻结生字将在下一轮无法投骰子。', true);
            refreshUI();
        }

        // 投骰子
        function rollDice() {
            if (!gameActive) return;
            if (eventCard.classList.contains('show')) return;
            if (isFrozen) {
                log('❄️ 你被冻结了，请先完成生字挑战！', true);
                return;
            }

            if (studentSkipNext[currentPlayerIndex]) {
                log(`❄️ 第 ${currentPlayerIndex + 1} 位 处于冻结状态，无法行动！必须先解冻。`, true);
                showFreezeEvent(true);
                return;
            }

            let attempts = 0;
            while (studentFinished[currentPlayerIndex] && attempts < students.length) {
                currentPlayerIndex = (currentPlayerIndex + 1) % students.length;
                attempts++;
            }
            if (studentFinished[currentPlayerIndex]) {
                log('所有学生都已完成！', true);
                return;
            }

            const dice = randomInt(1, 6);
            
            // 骰子动画
            diceReal.classList.add('rolling');
            setTimeout(() => {
                diceReal.classList.remove('rolling');
                renderDiceFace(dice);
            }, 400);

            const oldPos = studentPositions[currentPlayerIndex];
            let newPos = oldPos + dice;
            const studentNum = currentPlayerIndex + 1;

            log(`🎲 第 ${studentNum} 位投出 ${dice} 点，从 ${oldPos + 1} 前进到 ${newPos + 1}`, false);

            if (newPos >= END_CELL) {
                newPos = END_CELL;
                studentPositions[currentPlayerIndex] = newPos;
                studentFinished[currentPlayerIndex] = true;
                log(`🏆 第 ${studentNum} 位到达终点！`, false);
                refreshUI();
                if (studentFinished.every(Boolean)) {
                    gameActive = false;
                    log('🎉 所有学生都到达终点了！游戏结束！', true);
                    refreshUI();
                    return;
                }
                advanceToNextPlayer();
                refreshUI();
                return;
            }

            studentPositions[currentPlayerIndex] = newPos;
            refreshUI();

            if (CHALLENGE_CELLS.includes(newPos)) {
                showChallengeEvent();
            } else if (REWARD_CELLS.includes(newPos)) {
                showRewardEvent();
            } else if (FREEZE_CELLS.includes(newPos)) {
                showFreezeEvent(false);
            } else {
                showNormalEvent();
            }
        }

        // 普通格事件
        function showNormalEvent() {
            const studentNum = currentPlayerIndex + 1;
            const color = students[currentPlayerIndex];
            const word = drawFromPool(remainingWords, wordsArray);

            eventCard.classList.add('show');
            eventHeader.className = 'event-header normal-header';
            eventHeader.textContent = `📍 普通格 · 字词挑战`;

            eventContent.innerHTML = `
                <div style="display:flex; align-items:center; gap:0.8rem; margin-bottom:0.6rem;">
                    <span style="display:inline-block; width:1.4rem; height:1.4rem; border-radius:50%; background:${color}; box-shadow:0 0 12px ${color};"></span>
                    <span>第 ${studentNum} 位学生 请读字词：</span>
                </div>
                <div style="font-size:1.8rem; color:#ffd966; padding:0.5rem 0; text-align:center; font-weight:600; letter-spacing:2px;">「${word}」</div>
            `;

            eventActions.innerHTML = '';
            const successBtn = document.createElement('button');
            successBtn.className = 'btn btn-success btn-small';
            successBtn.textContent = '⭐ 读对了（获得星星）';
            successBtn.addEventListener('click', () => {
                studentStars[currentPlayerIndex] = (studentStars[currentPlayerIndex] || 0) + 1;
                log(`⭐ 第 ${studentNum} 位 读对「${word}」，获得 1 颗星星！`, false);
                eventCard.classList.remove('show');
                advanceToNextPlayer();
                refreshUI();
            });

            const failBtn = document.createElement('button');
            failBtn.className = 'btn btn-danger btn-small';
            failBtn.textContent = '✗ 读错了（不获得）';
            failBtn.addEventListener('click', () => {
                log(`✗ 第 ${studentNum} 位 读错「${word}」，没有获得星星`, false);
                eventCard.classList.remove('show');
                advanceToNextPlayer();
                refreshUI();
            });

            eventActions.appendChild(successBtn);
            eventActions.appendChild(failBtn);

            updateGameControls();
        }

        // 挑战格事件
        function showChallengeEvent() {
            const studentNum = currentPlayerIndex + 1;
            const color = students[currentPlayerIndex];
            const sentence = drawFromPool(remainingSentences, sentenceArray);

            eventCard.classList.add('show');
            eventHeader.className = 'event-header challenge-header';
            eventHeader.textContent = `⚔️ 挑战格 · 读句子！`;

            eventContent.innerHTML = `
                <div style="display:flex; align-items:center; gap:0.8rem; margin-bottom:0.6rem;">
                    <span style="display:inline-block; width:1.4rem; height:1.4rem; border-radius:50%; background:${color}; box-shadow:0 0 12px ${color};"></span>
                    <span>第 ${studentNum} 位学生 请读句子：</span>
                </div>
                <div style="font-size:1.4rem; color:#ffd966; padding:0.5rem 0; text-align:center; font-weight:500; line-height:1.6;">「${sentence}」</div>
            `;

            eventActions.innerHTML = '';
            const successBtn = document.createElement('button');
            successBtn.className = 'btn btn-success btn-small';
            successBtn.textContent = '⭐ 读对了（获得星星）';
            successBtn.addEventListener('click', () => {
                studentStars[currentPlayerIndex] = (studentStars[currentPlayerIndex] || 0) + 1;
                log(`⭐ 第 ${studentNum} 位 读对句子，获得 1 颗星星！`, false);
                eventCard.classList.remove('show');
                advanceToNextPlayer();
                refreshUI();
            });

            const failBtn = document.createElement('button');
            failBtn.className = 'btn btn-danger btn-small';
            failBtn.textContent = '✗ 读错了（不获得）';
            failBtn.addEventListener('click', () => {
                log(`✗ 第 ${studentNum} 位 读错句子，没有获得星星`, false);
                eventCard.classList.remove('show');
                advanceToNextPlayer();
                refreshUI();
            });

            eventActions.appendChild(successBtn);
            eventActions.appendChild(failBtn);

            updateGameControls();
        }

        // 奖励格事件
        function showRewardEvent() {
            const studentNum = currentPlayerIndex + 1;
            const color = students[currentPlayerIndex];
            
            let helperIndex = -1;
            if (students.length > 1) {
                const others = [];
                for (let i = 0; i < students.length; i++) {
                    if (i !== currentPlayerIndex) others.push(i);
                }
                helperIndex = others[randomInt(0, others.length - 1)];
            }
            
            const helperNum = helperIndex >= 0 ? helperIndex + 1 : studentNum;
            const helperColor = helperIndex >= 0 ? students[helperIndex] : color;
            
            const sentence = drawFromPool(remainingSentences, sentenceArray);

            eventCard.classList.add('show');
            eventHeader.className = 'event-header reward-header';
            eventHeader.textContent = `🎁 奖励格 · 双星降临！`;

            let contentHTML = `
                <div class="reward-line">
                    <span class="color-icon" style="background:${color}; color:${color};"></span>
                    <span>踩到奖励格！</span>
                </div>
            `;

            if (helperIndex >= 0) {
                contentHTML += `
                    <div class="reward-line">
                        <span>请</span>
                        <span class="color-icon" style="background:${helperColor}; color:${helperColor};"></span>
                        <span>帮忙读句子，</span>
                    </div>
                    <div class="reward-line" style="color:#2ecc71; font-weight:600;">
                        ✨ 两人都将获得星星！ ✨
                    </div>
                `;
            } else {
                contentHTML += `
                    <div class="reward-line">
                        <span>只有一位学生，请自己读句子（获得星星）：</span>
                    </div>
                `;
            }

            contentHTML += `
                <div style="font-size:1.4rem; color:#ffd966; padding:0.5rem 0; text-align:center; font-weight:500; line-height:1.6;">「${sentence}」</div>
            `;

            eventContent.innerHTML = contentHTML;

            eventActions.innerHTML = '';
            const okBtn = document.createElement('button');
            okBtn.className = 'btn btn-success';
            okBtn.textContent = '⭐ 确定（两人各得1颗星星）';
            okBtn.addEventListener('click', () => {
                studentStars[currentPlayerIndex] = (studentStars[currentPlayerIndex] || 0) + 1;
                if (helperIndex >= 0) {
                    studentStars[helperIndex] = (studentStars[helperIndex] || 0) + 1;
                }
                
                let logMsg = `🎁 第 ${studentNum} 位 踩到奖励格，获得 1 颗星星！`;
                if (helperIndex >= 0) {
                    logMsg += ` 第 ${helperNum} 位 帮忙代读，也获得 1 颗星星！`;
                }
                log(logMsg, false);

                eventCard.classList.remove('show');
                advanceToNextPlayer();
                refreshUI();
            });

            eventActions.appendChild(okBtn);

            updateGameControls();
        }

        // 冻结格事件
        function showFreezeEvent(isRecovery = false) {
            const studentNum = currentPlayerIndex + 1;
            const color = students[currentPlayerIndex];
            
            if (isRecovery) {
                if (!currentFreezeWords || currentFreezeWords.length === 0) {
                    const freezeWords = [];
                    const tempPool = [...remainingWords];
                    while (freezeWords.length < 5) {
                        if (tempPool.length === 0) tempPool.push(...wordsArray);
                        const idx = randomInt(0, tempPool.length - 1);
                        freezeWords.push(tempPool.splice(idx, 1)[0]);
                    }
                    currentFreezeWords = freezeWords;
                }
                frozenWordCount = 0;
                freezeSessionFailed = false;
            } else {
                const freezeWords = [];
                const tempPool = [...remainingWords];
                while (freezeWords.length < 5) {
                    if (tempPool.length === 0) tempPool.push(...wordsArray);
                    const idx = randomInt(0, tempPool.length - 1);
                    freezeWords.push(tempPool.splice(idx, 1)[0]);
                }
                currentFreezeWords = freezeWords;
                frozenWordCount = 0;
                freezeSessionFailed = false;
            }

            isFrozen = true;

            eventCard.classList.add('show');
            eventHeader.className = 'event-header freeze-header';
            
            if (isRecovery) {
                eventHeader.textContent = `❄️ 解冻 · 读出5个生字才能行动！`;
            } else {
                eventHeader.textContent = `❄️ 冻结格 · 读出5个生字！`;
            }

            eventContent.innerHTML = `
                <div style="display:flex; align-items:center; gap:0.8rem; margin-bottom:0.6rem;">
                    <span style="display:inline-block; width:1.6rem; height:1.6rem; border-radius:50%; background:${color}; box-shadow:0 0 12px ${color};"></span>
                    <span style="font-size:1.3rem;">第 ${studentNum} 位学生 ${isRecovery ? '需要解冻' : '被冻结'}！</span>
                </div>
                <div id="freezeWordsDisplay">
                    ${renderFreezeWordsHTML()}
                </div>
                <div style="font-size:1.1rem; color:#e74c3c; text-align:center; margin-top:1rem;">
                    ❄️ 注意：读完5个词完成挑战。如果本轮有读错，下一轮将无法投骰子。
                </div>
            `;

            renderFreezeButtons();
            updateGameControls();
            refreshUI();
        }

        // 渲染冻结生字
        function renderFreezeWordsHTML() {
            if (frozenWordCount >= 5) {
                return `<div class="freeze-word-big" style="color:#2ecc71; font-size:3rem;">✅ 解冻成功！</div>`;
            }
            const currentWord = currentFreezeWords[frozenWordCount];
            
            const wordList = currentFreezeWords.map((w, i) => {
                if (i < frozenWordCount) return `<span style="text-decoration:line-through; color:#6b8ab0;">${w}</span>`;
                if (i === frozenWordCount) return `<span style="color:#ffd966; font-weight:800; text-shadow:0 0 10px #ffd96680;">${w}</span>`;
                return `<span style="color:#4e6d8c;">${w}</span>`;
            }).join('');

            return `
                <div class="freeze-progress">
                    <span>进度：${frozenWordCount} / 5</span>
                </div>
                <div class="freeze-word-big">
                    「${currentWord}」
                </div>
                <div class="freeze-words-list">
                    ${wordList}
                </div>
            `;
        }

        // 渲染冻结格按钮
        function renderFreezeButtons() {
            eventActions.innerHTML = '';
            
            if (frozenWordCount >= 5) {
                const doneBtn = document.createElement('button');
                doneBtn.className = 'btn btn-success btn-large';
                doneBtn.textContent = '❄️ 完成，继续游戏';
                doneBtn.addEventListener('click', () => {
                    isFrozen = false;
                    frozenWordCount = 0;
                    currentFreezeWords = [];
                    
                    if (freezeSessionFailed) {
                        studentSkipNext[currentPlayerIndex] = true;
                        log(`❄️ 第 ${currentPlayerIndex + 1} 位 读完5个生字，但因为有读错，下一轮无法投骰子！`, false);
                    } else {
                        studentSkipNext[currentPlayerIndex] = false;
                        log(`❄️ 第 ${currentPlayerIndex + 1} 位 完美通过生字挑战！`, false);
                    }
                    
                    eventCard.classList.remove('show');
                    advanceToNextPlayer();
                    refreshUI();
                });
                eventActions.appendChild(doneBtn);
            } else {
                const successBtn = document.createElement('button');
                successBtn.className = 'btn btn-success btn-large';
                successBtn.textContent = `✅ 读对「${currentFreezeWords[frozenWordCount]}」`;
                successBtn.addEventListener('click', () => {
                    frozenWordCount++;
                    log(`❄️ 第 ${currentPlayerIndex + 1} 位 读对生字「${currentFreezeWords[frozenWordCount - 1]}」，进度 ${frozenWordCount}/5`, false);
                    
                    document.getElementById('freezeWordsDisplay').innerHTML = renderFreezeWordsHTML();
                    renderFreezeButtons();
                    updateStatus();
                });
                eventActions.appendChild(successBtn);

                const failBtn = document.createElement('button');
                failBtn.className = 'btn btn-danger btn-large';
                failBtn.textContent = '❌ 读错了';
                failBtn.addEventListener('click', () => {
                    freezeSessionFailed = true;
                    log(`❄️ 第 ${currentPlayerIndex + 1} 位 读错生字，本轮挑战带有惩罚标记！`, false);
                    
                    frozenWordCount++;
                    if (frozenWordCount >= 5) {
                        document.getElementById('freezeWordsDisplay').innerHTML = renderFreezeWordsHTML();
                    } else {
                        document.getElementById('freezeWordsDisplay').innerHTML = renderFreezeWordsHTML();
                    }
                    renderFreezeButtons();
                    updateStatus();
                });
                eventActions.appendChild(failBtn);
            }
        }

        // 切换到下一位
        function advanceToNextPlayer() {
            if (!gameActive) return;
            let attempts = 0;
            do {
                currentPlayerIndex = (currentPlayerIndex + 1) % students.length;
                attempts++;
            } while (studentFinished[currentPlayerIndex] && attempts < students.length);

            if (attempts >= students.length && studentFinished.every(Boolean)) {
                gameActive = false;
                log('🎉 所有学生都到达终点了！游戏结束！', true);
            }
            refreshUI();
        }

        // ================= 设置相关 =================
        function applyStudentCount() {
            let count = parseInt(studentCountInput.value, 10);
            if (isNaN(count) || count < 1) count = 1;
            if (count > 12) count = 12;
            studentCountInput.value = count;

            students = generateStudentColors(count);
            studentPositions = students.map(() => 0);
            studentStars = students.map(() => 0);
            studentFinished = students.map(() => false);
            studentSkipNext = students.map(() => false);

            resetGameState(false);
            refreshUI();
            log(`学生人数已设为 ${count} 人`, true);
        }

        function applyWordsAndSentence() {
            const rawWords = wordsInput.value.trim();
            const newWords = rawWords.split(/\s+/).filter(w => w.length > 0);
            if (newWords.length === 0) {
                log('字词不能为空，请至少输入一个词。', true);
                return;
            }
            wordsArray = newWords;

            const rawSentences = sentenceInput.value.trim();
            const newSentences = rawSentences.split('\n').map(s => s.trim()).filter(s => s.length > 0);
            if (newSentences.length === 0) {
                log('句子不能为空，请至少输入一个句子。', true);
                return;
            }
            sentenceArray = newSentences;

            if (gameActive) {
                resetGameState(false);
                log('字词/句子已更新，游戏已重置。', true);
            } else {
                log(`字词和句子已更新（${sentenceArray.length} 个句子）。`, true);
            }

            refreshUI();
        }

        function resetOrder() {
            if (gameActive) {
                log('游戏进行中不能重置顺序，请先重置游戏。', true);
                return;
            }
            students = generateStudentColors(students.length);
            resetGameState(false);
            refreshUI();
            log('学生顺序已重置为默认。', true);
        }

        function resetGameState(addLog = true) {
            gameActive = false;
            currentPlayerIndex = 0;
            studentPositions = students.map(() => 0);
            studentStars = students.map(() => 0);
            studentFinished = students.map(() => false);
            studentSkipNext = students.map(() => false);
            isFrozen = false;
            frozenWordCount = 0;
            currentFreezeWords = [];
            freezeSessionFailed = false;
            eventCard.classList.remove('show');
            renderDiceFace(1);
            if (addLog) log('游戏已重置。', true);
            refreshUI();
        }

        // ================= 事件绑定 =================
        applyCountBtn.addEventListener('click', applyStudentCount);
        applyWordsBtn.addEventListener('click', applyWordsAndSentence);

        wordsInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); applyWordsAndSentence(); }
        });

        resetOrderBtn.addEventListener('click', resetOrder);
        startGameBtn.addEventListener('click', startGame);
        rollDiceBtn.addEventListener('click', rollDice);
        resetGameBtn.addEventListener('click', () => resetGameState(true));

        // ================= 初始化 =================
        window.addEventListener('DOMContentLoaded', () => {
            studentCountInput.value = 4;

            const initialWords = wordsInput.value.trim();
            wordsArray = initialWords.split(/\s+/).filter(w => w.length > 0);

            const rawSentences = sentenceInput.value.trim();
            sentenceArray = rawSentences.split('\n').map(s => s.trim()).filter(s => s.length > 0);

            students = generateStudentColors(4);
            studentPositions = students.map(() => 0);
            studentStars = students.map(() => 0);
            studentFinished = students.map(() => false);
            studentSkipNext = students.map(() => false);

            gameActive = false;
            currentPlayerIndex = 0;

            renderDiceFace(1); // 初始显示1点
            refreshUI();
            log('欢迎！读错冻结生字将在下一轮无法投骰子。', true);
        });
    })();
</script>
</body>
</html>
